<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="my twitter">
<title>my twitter</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a2e'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle'%3E🕊️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1419; --card:#16202a; --border:#2f3b47; --text:#e7e9ea;
  --sub:#8b98a5; --accent:#1d9bf0; --accent2:#00ba7c; --danger:#f4212e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:rgba(15,20,25,.92);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
header h1{font-size:17px; margin:0; font-weight:700}
header .sub{font-size:11px; color:var(--sub); font-weight:400}
#gearBtn{background:none; border:none; font-size:20px; cursor:pointer; padding:4px}
main{max-width:600px; margin:0 auto}

/* 投稿ボックス */
#composer{padding:12px 16px; border-bottom:1px solid var(--border)}
#composer textarea{
  width:100%; min-height:72px; background:none; border:none; resize:none;
  color:var(--text); font-size:17px; font-family:inherit; line-height:1.5; outline:none;
}
#composer textarea::placeholder{color:var(--sub)}
#composerBar{display:flex; align-items:center; justify-content:flex-end; gap:12px}
#charCount{font-size:12px; color:var(--sub)}
#postBtn{
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:8px 20px; font-size:15px; font-weight:700; cursor:pointer;
}
#postBtn:disabled{opacity:.4}
#draftNote{font-size:12px; color:#f7b731; padding:0 16px 8px; display:none}

/* 今朝のストック */
#stockBox{border-bottom:8px solid var(--border)}
#stockHead{
  padding:12px 16px 4px; font-size:13px; color:var(--accent2); font-weight:700;
  display:flex; justify-content:space-between; align-items:center; cursor:pointer;
}
#stockHead .chev{color:var(--sub); font-size:12px}
#stockBody{padding:0 16px 12px; display:none}
#stockBody.open{display:block}
#stockBody h3{font-size:14px; margin:14px 0 4px; color:var(--text)}
.postblock{position:relative; background:#0a0e12; border:1px solid var(--border);
  border-radius:10px; padding:12px; margin:6px 0; white-space:pre-wrap; font-size:14px}
.copyBtn{
  position:absolute; top:6px; right:6px; background:var(--card); color:var(--sub);
  border:1px solid var(--border); border-radius:6px; font-size:11px; padding:3px 8px; cursor:pointer;
}
.copyBtn.done{color:var(--accent2); border-color:var(--accent2)}

/* タイムライン */
.tweet{padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:10px}
.tweet .avatar{font-size:22px; line-height:1.2}
.tweet .body{flex:1; min-width:0}
.tweet .meta{font-size:13px; color:var(--sub); margin-bottom:2px}
.tweet .text{white-space:pre-wrap; word-break:break-word}
#loadMore{display:block; width:100%; padding:14px; background:none; border:none;
  color:var(--accent); font-size:14px; cursor:pointer}
.note{padding:24px 16px; color:var(--sub); text-align:center; font-size:13px}

/* 設定・トースト */
#settings{
  position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
  align-items:flex-end; z-index:20;
}
#settings.open{display:flex}
#settingsCard{
  background:var(--card); width:100%; max-width:600px; margin:0 auto;
  border-radius:16px 16px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom));
}
#settingsCard h2{font-size:16px; margin:0 0 12px}
#settingsCard label{font-size:13px; color:var(--sub); display:block; margin:12px 0 4px}
#settingsCard input{
  width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
  color:var(--text); padding:10px; font-size:14px;
}
#settingsCard .row{display:flex; gap:10px; margin-top:16px}
#settingsCard button{
  flex:1; padding:12px; border-radius:999px; border:none; font-size:15px;
  font-weight:700; cursor:pointer;
}
#saveBtn{background:var(--accent); color:#fff}
#closeBtn{background:var(--border); color:var(--text)}
#toast{
  position:fixed; bottom:calc(30px + env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%); background:var(--accent); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:14px; display:none; z-index:30;
  max-width:88%;
}
#toast.err{background:var(--danger)}
</style>
</head>
<body>
<header>
  <div>
    <h1>my twitter <span class="sub">読者：秘書1名</span></h1>
  </div>
  <button id="gearBtn" title="設定">⚙️</button>
</header>
<main>
  <div id="stockBox">
    <div id="stockHead">
      <span id="stockTitle">📮 秘書からの納品</span><span class="chev">▼ ひらく</span>
    </div>
    <div id="stockBody"></div>
  </div>
  <div id="composer">
    <textarea id="text" placeholder="いまどうしてる？（明日のネタになります）"></textarea>
    <div id="composerBar">
      <span id="charCount"></span>
      <button id="postBtn" disabled>投稿する</button>
    </div>
  </div>
  <div id="draftNote"></div>
  <div id="timeline"><div class="note">読み込み中…</div></div>
</main>

<div id="settings">
  <div id="settingsCard">
    <h2>設定</h2>
    <label>GitHubの合鍵（github_pat_… で始まる文字列）</label>
    <input id="tokenInput" type="password" placeholder="github_pat_XXXX…" autocomplete="off">
    <p style="font-size:12px;color:var(--sub);margin:8px 0 0">
      合鍵はこのiPhoneの中にだけ保存されます。どこにも送信されません（GitHub本体を除く）。
    </p>
    <div class="row">
      <button id="closeBtn">とじる</button>
      <button id="saveBtn">保存する</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const OWNER="naganoyoh", REPO="secretary", BRANCH="main";
const MEMO_DIR="ネタメモ", STOCK_DIR="SNSストック";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const $=id=>document.getElementById(id);
let token=localStorage.getItem("mytw_token")||"";
let fileList=[], shown=0; const PAGE=15;

/* ---------- 共通 ---------- */
function headers(raw){
  const h={Authorization:"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"};
  h.Accept=raw?"application/vnd.github.raw+json":"application/vnd.github+json";
  return h;
}
function toast(msg,err){
  const t=$("toast"); t.textContent=msg; t.className=err?"err":""; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",3000);
}
function jstNow(){
  const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
    .format(new Date()); // "2026-08-07 21:35:12"
  return p;
}
function b64utf8(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)));}

/* ---------- 設定 ---------- */
$("gearBtn").onclick=()=>{ $("tokenInput").value=token; $("settings").classList.add("open"); };
$("closeBtn").onclick=()=>$("settings").classList.remove("open");
$("saveBtn").onclick=()=>{
  token=$("tokenInput").value.trim();
  localStorage.setItem("mytw_token",token);
  $("settings").classList.remove("open");
  toast("保存しました"); init();
};

/* ---------- 投稿 ---------- */
const ta=$("text");
ta.addEventListener("input",()=>{
  const n=ta.value.trim().length;
  $("charCount").textContent=n? n+"字":"";
  $("postBtn").disabled=!n;
});
$("postBtn").onclick=post;
async function post(){
  const body=ta.value.trim(); if(!body) return;
  if(!token){ toast("先に⚙️から合鍵を保存してください",1); return; }
  $("postBtn").disabled=true; $("postBtn").textContent="送信中…";
  const now=jstNow();                       // 2026-08-07 21:35:12
  const stamp=now.replace(/[-: ]/g,"").slice(0,14); // 20260807213512
  const path=`${MEMO_DIR}/${now.slice(0,10)}_${stamp.slice(8)}.md`;
  const content=`---\ntags: [ネタメモ]\n投稿日時: ${now} (JST)\n経路: my-twitter\n---\n\n${body}\n`;
  try{
    const r=await fetch(API+encodeURIComponent(MEMO_DIR)+"/"+encodeURIComponent(path.split("/")[1]),{
      method:"PUT",headers:headers(),
      body:JSON.stringify({message:"ネタメモ投稿（my-twitter）",branch:BRANCH,content:b64utf8(content)})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    ta.value=""; ta.dispatchEvent(new Event("input"));
    localStorage.removeItem("mytw_draft"); $("draftNote").style.display="none";
    toast("投稿しました 🕊️ 明日の朝、ネタになります");
    prependTweet({name:path,when:now.slice(5,16),text:body});
  }catch(e){
    localStorage.setItem("mytw_draft",body);
    $("draftNote").textContent="⚠️ 送れなかったので下書き保存しました（"+e.message+"）。電波のあるところでもう一度どうぞ。";
    $("draftNote").style.display="block";
    toast("送信に失敗しました。下書きは残っています",1);
  }
  $("postBtn").textContent="投稿する"; $("postBtn").disabled=!ta.value.trim();
}

/* ---------- タイムライン ---------- */
function tweetEl(t){
  const d=document.createElement("div"); d.className="tweet";
  d.innerHTML=`<div class="avatar">💭</div><div class="body">
    <div class="meta">${t.when}</div><div class="text"></div></div>`;
  d.querySelector(".text").textContent=t.text;
  return d;
}
function prependTweet(t){
  const tl=$("timeline"); const n=tl.querySelector(".note"); if(n) n.remove();
  tl.prepend(tweetEl(t));
}
function parseMemo(name,raw){
  let when=name.replace(/\.md$/,"").replace("_"," ");
  let text=raw;
  const m=raw.match(/^---\n([\s\S]*?)\n---\n*/);
  if(m){ text=raw.slice(m[0].length);
    const w=m[1].match(/投稿日時:\s*(.+?)(\s*\(JST\))?$/m); if(w) when=w[1].slice(5,16);
  }
  return {name,when,text:text.trim()};
}
async function loadList(){
  const r=await fetch(API+encodeURIComponent(MEMO_DIR)+"?ref="+BRANCH,{headers:headers()});
  if(r.status===404) return [];       // フォルダがまだ無い
  if(!r.ok) throw new Error("HTTP "+r.status);
  const arr=await r.json();
  return arr.filter(f=>f.type==="file"&&f.name.endsWith(".md"))
            .sort((a,b)=>b.name.localeCompare(a.name));
}
async function showMore(){
  const slice=fileList.slice(shown,shown+PAGE); shown+=slice.length;
  const tl=$("timeline");
  for(const f of slice){
    try{
      const r=await fetch(f.url,{headers:headers(true)});
      const raw=await r.text();
      tl.insertBefore(tweetEl(parseMemo(f.name,raw)),$("loadMore"));
    }catch(e){/* 1件失敗しても続ける */}
  }
  if(shown>=fileList.length&&$("loadMore")) $("loadMore").remove();
}
async function loadTimeline(){
  const tl=$("timeline");
  try{
    fileList=await loadList(); shown=0; tl.innerHTML="";
    if(!fileList.length){
      tl.innerHTML='<div class="note">まだ投稿がありません。<br>最初のひとことをどうぞ。それが明日のポストの種になります。</div>';
      return;
    }
    const more=document.createElement("button"); more.id="loadMore";
    more.textContent="さらに表示"; more.onclick=showMore; tl.appendChild(more);
    await showMore();
  }catch(e){
    tl.innerHTML=`<div class="note">読み込めませんでした（${e.message}）。<br>⚙️の合鍵を確認してください。</div>`;
  }
}

/* ---------- 秘書からの納品（SNSストック最新） ---------- */
$("stockHead").onclick=()=>{
  $("stockBody").classList.toggle("open");
  $("stockHead").querySelector(".chev").textContent=
    $("stockBody").classList.contains("open")?"▲ とじる":"▼ ひらく";
};
function renderStock(md){
  const box=$("stockBody"); box.innerHTML="";
  const parts=md.split(/```/);
  parts.forEach((p,i)=>{
    if(i%2===1){ // コードブロック＝ポスト本文
      const d=document.createElement("div"); d.className="postblock";
      d.textContent=p.replace(/^\n|\n$/g,"");
      const b=document.createElement("button"); b.className="copyBtn"; b.textContent="コピー";
      b.onclick=async ev=>{ev.stopPropagation();
        await navigator.clipboard.writeText(d.textContent);
        b.textContent="✓ コピーした"; b.classList.add("done");
        setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},2000);
      };
      d.appendChild(b); box.appendChild(d);
    }else{
      p.split("\n").forEach(line=>{
        const h=line.match(/^#{2,3}\s+(.+)/);
        if(h){const e=document.createElement("h3");e.textContent=h[1];box.appendChild(e);}
      });
    }
  });
}
async function loadStock(){
  try{
    const r=await fetch(API+encodeURIComponent(STOCK_DIR)+"?ref="+BRANCH,{headers:headers()});
    if(r.status===404){ $("stockTitle").textContent="📮 秘書からの納品（まだありません）"; return; }
    if(!r.ok) return;
    const arr=(await r.json()).filter(f=>f.type==="file"&&f.name.endsWith(".md"))
      .sort((a,b)=>b.name.localeCompare(a.name));
    if(!arr.length){ $("stockTitle").textContent="📮 秘書からの納品（まだありません）"; return; }
    const latest=arr[0];
    $("stockTitle").textContent="📮 秘書からの納品："+latest.name.replace(/\.md$/,"");
    const raw=await (await fetch(latest.url,{headers:headers(true)})).text();
    renderStock(raw);
  }catch(e){/* ストック欄は失敗しても本体の邪魔をしない */}
}

/* ---------- 起動 ---------- */
function init(){
  const draft=localStorage.getItem("mytw_draft");
  if(draft&&!ta.value){ ta.value=draft; ta.dispatchEvent(new Event("input"));
    $("draftNote").textContent="⚠️ 前回送れなかった下書きを復元しました。";
    $("draftNote").style.display="block";
  }
  if(!token){
    $("timeline").innerHTML='<div class="note">はじめまして。⚙️（右上）から合鍵を保存すると動き出します。</div>';
    return;
  }
  loadTimeline(); loadStock();
}
init();
</script>
</body>
</html>
