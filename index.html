<style>
:root{
  --bg:#f5f8fa; --card:#ffffff; --border:#e1e8ed; --text:#14171a;
  --sub:#657786; --accent:#1da1f2; --accent-dark:#1a91da;
  --accent2:#17bf63; --danger:#e0245e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent); text-decoration:none; word-break:break-all}
a:active{text-decoration:underline}
header{
  position:sticky; top:0; z-index:10; background:var(--accent);
  border-bottom:1px solid var(--accent-dark);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
header h1{font-size:17px; margin:0; font-weight:800; color:#fff}
#gearBtn{background:none; border:none; font-size:20px; cursor:pointer; padding:4px}
main{max-width:600px; margin:0 auto}

/* 投稿ボックス */
#composer{padding:12px 16px; background:var(--card); border-bottom:1px solid var(--border)}
#composer textarea{
  width:100%; min-height:76px; background:none; border:none; resize:none;
  color:var(--text); font-size:17px; font-family:inherit; line-height:1.5; outline:none;
}
#composer textarea::placeholder{color:#aab8c2}
#composerBar{display:flex; align-items:center; justify-content:flex-end; gap:12px;
  border-top:1px solid var(--border); padding-top:10px}
#charCount{font-size:12px; color:var(--sub)}
#postBtn{
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:8px 22px; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:0 1px 3px rgba(29,161,242,.35);
}
#postBtn:disabled{opacity:.45; box-shadow:none}
#draftNote{font-size:12px; color:#b7791f; background:#fffbea;
  padding:8px 16px; display:none; border-bottom:1px solid var(--border)}

/* 秘書からの納品 */
#stockBox{background:var(--card); border-bottom:8px solid var(--bg);
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
#stockHead{
  padding:12px 16px; font-size:13px; color:var(--sub); font-weight:700;
  display:flex; justify-content:space-between; align-items:center; cursor:pointer;
}
#stockHead .chev{color:var(--sub); font-size:12px; font-weight:400}
#stockBody{padding:0 16px 12px; display:none}
#stockBody.open{display:block}
#stockBody h3{font-size:14px; margin:14px 0 4px}
.postblock{position:relative; background:#f5f8fa; border:1px solid var(--border);
  border-radius:12px; padding:12px; padding-right:64px; margin:6px 0;
  white-space:pre-wrap; font-size:14px; overflow-wrap:anywhere}
.mediaLabel{display:inline-block; font-size:11px; font-weight:700; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:1px 10px; margin-top:10px}

/* タイムライン */
.tweet{padding:12px 16px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; gap:10px}
.tweet .avatar{width:40px; height:40px; border-radius:50%; flex-shrink:0}
.tweet .body{flex:1; min-width:0}
.tweet .meta{font-size:13px; color:var(--sub); margin-bottom:2px;
  display:flex; align-items:center; justify-content:space-between}
.tweet .meta .who b{color:var(--text); font-weight:700; font-size:14px}
.tweet .text{white-space:pre-wrap; word-break:break-word}
.copyBtn{
  background:none; color:var(--sub); border:1px solid var(--border);
  border-radius:999px; font-size:11px; padding:3px 10px; cursor:pointer; flex-shrink:0;
}
.copyBtn.done{color:var(--accent); border-color:var(--accent)}
.postblock .copyBtn{position:absolute; top:8px; right:8px; background:var(--card)}
#loadMore{display:block; width:100%; padding:14px; background:var(--card); border:none;
  border-top:1px solid var(--border); color:var(--accent); font-size:14px; cursor:pointer}
.note{padding:28px 16px; color:var(--sub); text-align:center; font-size:13px}

/* 設定・トースト */
#settings{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
  align-items:flex-end; z-index:20}
#settings.open{display:flex}
#settingsCard{
  background:var(--card); width:100%; max-width:600px; margin:0 auto;
  border-radius:16px 16px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 24px rgba(0,0,0,.12);
}
#settingsCard h2{font-size:16px; margin:0 0 12px}
#settingsCard label{font-size:13px; color:var(--sub); display:block; margin:12px 0 4px}
#settingsCard input{
  width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
  color:var(--text); padding:10px; font-size:14px;
}
#settingsCard .row{display:flex; gap:10px; margin-top:16px}
#settingsCard .row button{
  flex:1; padding:12px; border-radius:999px; border:none; font-size:15px;
  font-weight:700; cursor:pointer;
}
#saveBtn{background:var(--accent); color:#fff}
#closeBtn{background:var(--bg); color:var(--text); border:1px solid var(--border)!important}
#toast{
  position:fixed; bottom:calc(30px + env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%); background:var(--accent); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:14px; display:none; z-index:30;
  max-width:88%; box-shadow:0 2px 10px rgba(0,0,0,.18);
}
#toast.err{background:var(--danger)}
</style>
</head>
<body>
<header>
  <div><h1>My Twitter</h1></div>
  <button id="gearBtn" title="設定">⚙️</button>
</header>
<main>
  <div id="stockBox">
    <div id="stockHead">
      <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7.5l10 6 10-6"/></svg><span id="stockTitle">秘書からの納品</span></span><span class="chev">▼ ひらく</span>
    </div>
    <div id="stockBody"></div>
  </div>
  <div id="composer">
    <textarea id="text" placeholder="いまなにしてる？"></textarea>
    <div id="composerBar">
      <span id="charCount"></span>
      <button id="postBtn" disabled>ツイートする</button>
    </div>
  </div>
  <div id="draftNote"></div>
  <div id="timeline"><div class="note">読み込み中…</div></div>
</main>

<div id="settings">
  <div id="settingsCard">
    <h2>設定</h2>
    <label>GitHubの合鍵（github_pat_… で始まる文字列）</label>
    <input id="tokenInput" type="password" placeholder="github_pat_XXXX…" autocomplete="off">
    <p style="font-size:12px;color:var(--sub);margin:8px 0 0">
      合鍵はこの端末の中にだけ保存されます。送信先はGitHubのみです。
    </p>
    <div class="row">
      <button id="closeBtn">とじる</button>
      <button id="saveBtn">保存する</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const OWNER="naganoyoh", REPO="secretary", BRANCH="main";

const $=id=>document.getElementById(id);
let token=localStorage.getItem("mytw_token")||"";
let fileList=[], shown=0; const PAGE=15;

/* ---------- 共通 ---------- */
function headers(raw){
  const h={Authorization:"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"};
  h.Accept=raw?"application/vnd.github.raw+json":"application/vnd.github+json";
  return h;
}
function toast(msg,err){
  const t=$("toast"); t.textContent=msg; t.className=err?"err":""; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",3000);
}
function jstNow(){
  return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
}
function b64utf8(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)));}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function linkify(s){
  return esc(s).replace(/https?:\/\/[^\s<>"）」]+/g,
    u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}
function copyBtn(getText){
  const b=document.createElement("button"); b.className="copyBtn"; b.textContent="コピー";
  b.onclick=async ev=>{ev.stopPropagation();
    try{ await navigator.clipboard.writeText(getText()); }
    catch(e){ toast("コピーできませんでした",1); return; }
    b.textContent="✓ コピー済"; b.classList.add("done");
    setTimeout(()=>{b.textContent="コピー"; b.classList.remove("done")},2000);
  };
  return b;
}

/* ---------- 設定 ---------- */
$("gearBtn").onclick=()=>{ $("tokenInput").value=token; $("settings").classList.add("open"); };
$("closeBtn").onclick=()=>$("settings").classList.remove("open");
$("saveBtn").onclick=()=>{
  token=$("tokenInput").value.trim();
  localStorage.setItem("mytw_token",token);
  $("settings").classList.remove("open");
  toast("保存しました"); init();
};

/* ---------- 投稿（月別フォルダに保存） ---------- */
const ta=$("text");
ta.addEventListener("input",()=>{
  const n=ta.value.trim().length;
  $("charCount").textContent=n? n+"字":"";
  $("postBtn").disabled=!n;
});
$("postBtn").onclick=post;
async function post(){
  const body=ta.value.trim(); if(!body) return;
  if(!token){ toast("先に⚙️から合鍵を保存してください",1); return; }
  $("postBtn").disabled=true; $("postBtn").textContent="送信中…";
  const now=jstNow();                              // 2026-08-08 01:17:41
  const ym=now.slice(0,7);                         // 2026-08
  const fname=now.slice(0,10)+"_"+now.slice(11).replace(/:/g,"")+".md";
  const content=`---\ntags: [ネタメモ]\n投稿日時: ${now} (JST)\n経路: my-twitter\n---\n\n${body}\n`;
  try{
    const url=API+encodeURIComponent(MEMO_DIR)+"/"+encodeURIComponent(ym)+"/"+encodeURIComponent(fname);
    const r=await fetch(url,{method:"PUT",headers:headers(),
      body:JSON.stringify({message:"ネタメモ投稿（my-twitter）",branch:BRANCH,content:b64utf8(content)})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    ta.value=""; ta.dispatchEvent(new Event("input"));
    localStorage.removeItem("mytw_draft"); $("draftNote").style.display="none";
    toast("投稿しました 🕊️ 明日の朝、ネタになります");
    prependTweet({when:now.slice(5,16),text:body});
  }catch(e){
    localStorage.setItem("mytw_draft",body);
    $("draftNote").textContent="⚠️ 送れなかったので下書き保存しました（"+e.message+"）。あとでもう一度どうぞ。";
    $("draftNote").style.display="block";
    toast("送信に失敗しました。下書きは残っています",1);
  }
  $("postBtn").textContent="ツイートする"; $("postBtn").disabled=!ta.value.trim();
}

/* ---------- タイムライン ---------- */
function tweetEl(t){
  const d=document.createElement("div"); d.className="tweet";
  d.innerHTML=`<img class="avatar" src="${AVATAR}" alt=""><div class="body">
    <div class="meta"><span class="who"><b>ヨウ</b> · ${esc(t.when)}</span></div>
    <div class="text">${linkify(t.text)}</div></div>`;
  d.querySelector(".meta").appendChild(copyBtn(()=>t.text));
  return d;
}
function prependTweet(t){
  const tl=$("timeline"); const n=tl.querySelector(".note"); if(n) n.remove();
  tl.prepend(tweetEl(t));
}
function parseMemo(name,raw){
  let when=name.replace(/\.md$/,"").replace("_"," ");
  let text=raw;
  const m=raw.match(/^---\n([\s\S]*?)\n---\n*/);
  if(m){ text=raw.slice(m[0].length);
    const w=m[1].match(/投稿日時:\s*(.+?)(\s*\(JST\))?$/m); if(w) when=w[1].slice(5,16);
  }
  return {when,text:text.trim()};
}
async function ghList(path){
  const r=await fetch(API+path.split("/").map(encodeURIComponent).join("/")+"?ref="+BRANCH,{headers:headers()});
  if(r.status===404) return [];
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function loadList(){
  const root=await ghList(MEMO_DIR);
  let files=root.filter(f=>f.type==="file"&&f.name.endsWith(".md"));
  const months=root.filter(f=>f.type==="dir"&&/^\d{4}-\d{2}$/.test(f.name))
                   .sort((a,b)=>b.name.localeCompare(a.name));
  for(const mdir of months){
    const inside=await ghList(MEMO_DIR+"/"+mdir.name);
    files=files.concat(inside.filter(f=>f.type==="file"&&f.name.endsWith(".md")));
  }
  return files.sort((a,b)=>b.name.localeCompare(a.name));
}
async function showMore(){
  const slice=fileList.slice(shown,shown+PAGE); shown+=slice.length;
  const tl=$("timeline");
  for(const f of slice){
    try{
      const r=await fetch(f.url,{headers:headers(true)});
      const raw=await r.text();
      const el=tweetEl(parseMemo(f.name,raw));
      const more=$("loadMore");
      more? tl.insertBefore(el,more) : tl.appendChild(el);
    }catch(e){/* 1件失敗しても続ける */}
  }
  if(shown>=fileList.length&&$("loadMore")) $("loadMore").remove();
}
async function loadTimeline(){
  const tl=$("timeline");
  try{
    fileList=await loadList(); shown=0; tl.innerHTML="";
    if(!fileList.length){
      tl.innerHTML='<div class="note">まだ投稿がありません。<br>最初のひとことをどうぞ。それが明日のポストの種になります。</div>';
      return;
    }
    const more=document.createElement("button"); more.id="loadMore";
    more.textContent="さらに表示"; more.onclick=showMore; tl.appendChild(more);
    await showMore();
  }catch(e){
    tl.innerHTML=`<div class="note">読み込めませんでした（${esc(e.message)}）。<br>⚙️の合鍵を確認してください。</div>`;
  }
}

/* ---------- 秘書からの納品（SNSストック最新） ---------- */
$("stockHead").onclick=()=>{
  $("stockBody").classList.toggle("open");
  $("stockHead").querySelector(".chev").textContent=
    $("stockBody").classList.contains("open")?"▲ とじる":"▼ ひらく";
};
function renderStock(md){
  const box=$("stockBody"); box.innerHTML="";
  md.split(/```/).forEach((p,i)=>{
    if(i%2===1){
      const body=p.replace(/^\n|\n$/g,"");
      const d=document.createElement("div"); d.className="postblock";
      d.innerHTML=linkify(body);
      d.appendChild(copyBtn(()=>body));
      box.appendChild(d);
    }else{
      p.split("\n").forEach(line=>{
        const h=line.match(/^#{2,3}\s+(.+)/);
        if(h){const e=document.createElement("h3");e.textContent=h[1];box.appendChild(e);return;}
        const c=line.match(/^- \[.\]\s+(.+)/);
        if(c){const e=document.createElement("span");e.className="mediaLabel";e.textContent=c[1];box.appendChild(e);}
      });
    }
  });
}
async function loadStock(){
  try{
    const arr=(await ghList(STOCK_DIR)).filter(f=>f.type==="file"&&f.name.endsWith(".md"))
      .sort((a,b)=>b.name.localeCompare(a.name));
    if(!arr.length){ $("stockTitle").textContent="秘書からの納品（まだありません）"; return; }
    const latest=arr[0];
    $("stockTitle").textContent="秘書からの納品："+latest.name.replace(/\.md$/,"");
    const raw=await (await fetch(latest.url,{headers:headers(true)})).text();
    renderStock(raw);
  }catch(e){/* ストック欄は失敗しても本体の邪魔をしない */}
}

/* ---------- 起動 ---------- */
function init(){
  const draft=localStorage.getItem("mytw_draft");
  if(draft&&!ta.value){ ta.value=draft; ta.dispatchEvent(new Event("input"));
    $("draftNote").textContent="⚠️ 前回送れなかった下書きを復元しました。";
    $("draftNote").style.display="block";
  }
  if(!token){
    $("timeline").innerHTML='<div class="note">はじめまして。⚙️（右上）から合鍵を保存すると動き出します。</div>';
    return;
  }
  loadTimeline(); loadStock();
}
init();
</script>
